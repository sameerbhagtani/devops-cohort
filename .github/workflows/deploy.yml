name: Deploy Node.js code

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Deploy on ExCloud
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: 210.79.128.212
                  username: ubuntu
                  key: ${{ secrets.PRIVATE_KEY }}
                  script: |
                      cd /home/ubuntu/devops-cohort
                      git pull
                      pnpm i
                      pm2 restart 0
