name: Deploy Node.js code

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: QEMU
              uses: docker/setup-qemu-action@v4

            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker Build and Push
              run: |
                  docker build -t sameerbhagtani/devops-cohort .
                  docker push sameerbhagtani/devops-cohort

            - name: Deploy on ExCloud
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: 210.79.128.212
                  username: ubuntu
                  key: ${{ secrets.PRIVATE_KEY }}
                  script: |
                      # Kill the exiting docker container
                      sudo docker rm -f devops-cohort || true

                      # Pull the fresh image from the hub
                      sudo docker pull sameerbhagtani/devops-cohort

                      # Run the container
                      sudo docker run -d --name devops-cohort --restart unless-stopped -p 3000:3000 sameerbhagtani/devops-cohort

                      # Clean up old/unused images
                      sudo docker image prune -f
